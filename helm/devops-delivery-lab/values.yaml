replicaCount: 1

image:
  repository: ghcr.io/andrii1997olenovych/devops-delivery-lab
  tag: ''
  pullPolicy: Always

imagePullSecrets: []

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: ''
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

application:
  logLevel: info

database:
  image: postgres:16.8-alpine
  user: postgres
  password: postgres
  name: tasks
  url: ''
  storage: emptyDir

redis:
  image: redis:7.4.2-alpine
  url: ''
