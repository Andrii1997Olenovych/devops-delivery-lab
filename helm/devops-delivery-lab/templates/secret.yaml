{{- $fullName := include "devops-delivery-lab.fullname" . }}
{{- $databaseUrl := .Values.database.url | default (printf "postgresql://%s:%s@%s-postgres:5432/%s" .Values.database.user .Values.database.password $fullName .Values.database.name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "devops-delivery-lab.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ $databaseUrl | quote }}
  MIGRATION_DATABASE_URL: {{ $databaseUrl | quote }}
  POSTGRES_PASSWORD: {{ .Values.database.password | quote }}
