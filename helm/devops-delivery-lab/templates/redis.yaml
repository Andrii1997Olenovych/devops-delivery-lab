apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devops-delivery-lab.fullname" . }}-redis
  labels:
    {{- include "devops-delivery-lab.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "devops-delivery-lab.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: cache
  template:
    metadata:
      labels:
        {{- include "devops-delivery-lab.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cache
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "devops-delivery-lab.fullname" . }}-redis
  labels:
    {{- include "devops-delivery-lab.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache
spec:
  ports:
    - port: 6379
      targetPort: redis
      name: redis
  selector:
    {{- include "devops-delivery-lab.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: cache
