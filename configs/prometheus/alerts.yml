groups:
  - name: devops-delivery-lab
    rules:
      - alert: ApplicationUnavailable
        expr: up{job="app"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: The task API cannot be scraped by Prometheus.
      - alert: HighServerErrorRate
        expr: sum(rate(http_requests_total{status_code=~"5.."}[1m])) / clamp_min(sum(rate(http_requests_total[1m])), 1) > 0.10
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: More than ten percent of recent API responses are 5xx.
      - alert: PostgreSQLUnavailable
        expr: dependency_up{dependency="postgres"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: The task API cannot reach PostgreSQL and is not ready for traffic.
